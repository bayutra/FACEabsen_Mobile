# Codemagic CI — build IPA iOS TANPA signing.
#
# Tujuan: menghasilkan `FaceAbsen-unsigned.ipa` yang bisa ditandatangani lalu
# dipasang dari Windows memakai Sideloadly (lihat docs/guides/IOS_SETUP.md).
# Tidak butuh akun Apple Developer berbayar: signing dilakukan di sisi Windows
# dengan Apple ID biasa (sertifikat gratis, berlaku 7 hari).
#
# Cara pakai:
#   1. Push repo ini ke GitHub.
#   2. Codemagic > Add application > pilih repo.
#      - Project type : Flutter   (BUKAN iOS/Android native)
#      - Project path : mobile    (folder yang berisi pubspec.yaml)
#      - Branch       : master
#   3. Pilih konfigurasi "codemagic.yaml", lalu Start new build.
#   4. Unduh artifact FaceAbsen-unsigned.ipa dari tab Artifacts.
#
# Catatan: `flutter build ios` HANYA bisa jalan di macOS. Workflow inilah
# pengganti Mac lokal — jangan dijalankan di Windows.
#
# Signing dimatikan di level project iOS (lihat mobile/ios/Runner.xcodeproj
# dan Podfile: CODE_SIGNING_ALLOWED=NO), jadi build tidak memerlukan
# Development Team. Jika suatu saat mau build dengan sertifikat asli,
# aktifkan kembali signing di Xcode.

workflows:
  ios-unsigned:
    name: iOS unsigned IPA (for Sideloadly)
    instance_type: mac_mini_m2
    max_build_duration: 60
    # Semua script berjalan dengan CWD = <clone>/mobile.
    working_directory: mobile
    environment:
      flutter: 3.22.2
      xcode: 16.0
      cocoapods: default
      vars:
        # Alamat default yang dibakar saat build. Bisa diganti dari dalam
        # aplikasi (Login -> "Server: ...") tanpa build ulang, jadi nilai ini
        # hanya titik awal.
        # CATATAN KEAMANAN: rilis asli wajib https + API_CERT_SHA256
        # (fingerprint sertifikat). Flag ALLOW_INSECURE_HTTP di bawah hanya
        # untuk build demo/sideload di LAN; cabut sebelum rilis store.
        API_BASE_URL: "http://192.168.120.111:3000/api/v1"
        ALLOW_INSECURE_HTTP: "true"
        # API_CERT_SHA256 sengaja TIDAK dideklarasikan: Codemagic menolak nilai
        # kosong pada `vars`. Script build memakai ${API_CERT_SHA256:-} sehingga
        # tetap aman dengan `set -u`; untuk rilis https isi lewat secure env.
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: master
          include: true
      cancel_previous_builds: true
    cache:
      # Mempercepat rebuild saat iterasi konfigurasi iOS.
      cache_paths:
        - $HOME/.pub-cache
        - $HOME/Library/Caches/CocoaPods
    scripts:
      - name: Flutter pub get
        script: |
          flutter --version
          flutter pub get
      - name: Analyze & unit test
        script: |
          flutter analyze
          flutter test
      - name: Prepare iOS build config (dart-defines, pods)
        script: |
          # `--config-only` HANYA menyiapkan konfigurasi (Generated.xcconfig
          # berisi DART_DEFINES/FLUTTER_ROOT, plus pod install) lalu berhenti
          # tanpa memanggil xcodebuild (lihat flutter_tools/ios/mac.dart).
          set -euo pipefail
          flutter build ios --release --no-codesign --config-only \
            --dart-define=API_BASE_URL="${API_BASE_URL:-}" \
            --dart-define=ALLOW_INSECURE_HTTP="${ALLOW_INSECURE_HTTP:-false}" \
            --dart-define=API_CERT_SHA256="${API_CERT_SHA256:-}"
      - name: Build iOS with xcodebuild (unsigned)
        script: |
          # xcodebuild dipanggil langsung: `flutter build ios` menyembunyikan
          # output xcodebuild dan menggantinya dengan diagnosis "Development
          # Team" yang menyesatkan ketika DEVELOPMENT_TEAM tidak diisi.
          #
          # JANGAN override CONFIGURATION_BUILD_DIR: script copy-resources pod
          # menghitung lokasi bundle dari setting itu, dan override membuat
          # FirebaseCoreInternal_Privacy.bundle tidak ditemukan. Pakai
          # -derivedDataPath supaya produk tetap di lokasi yang pasti.
          set -o pipefail
          cd ios
          xcodebuild -workspace Runner.xcworkspace -scheme Runner -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath "$(pwd)/../build/ios/derived" \
            -quiet \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee ../xcodebuild.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            echo "========== RINGKASAN ERROR XCODEBUILD =========="
            grep -n -E "error:|fatal error:|Command PhaseScriptExecution failed|The following build commands failed|BUILD FAILED" ../xcodebuild.log | tail -n 80 || true
            echo "========== AKHIR RINGKASAN =========="
            exit "$status"
          fi
      - name: Package IPA
        script: |
          # `ditto` menjaga symlink di dalam framework — wajib agar IPA valid.
          set -euo pipefail
          APP_DIR=build/ios/derived/Build/Products/Release-iphoneos
          # Tolak memaket app yang tidak lengkap. Tanpa binary utama, IPA akan
          # ditolak Sideloadly ("bundle_main_missing: Payload/Runner.app/Runner").
          test -f "$APP_DIR/Runner.app/Runner"
          test -f "$APP_DIR/Runner.app/Frameworks/Flutter.framework/Flutter"
          rm -rf build/ios/ipa-work
          mkdir -p build/ios/ipa-work/Payload build/ios/iphoneos
          cp -R "$APP_DIR/Runner.app" build/ios/ipa-work/Payload/
          ( cd build/ios/ipa-work && ditto -c -k --sequesterRsrc --keepParent Payload ../iphoneos/FaceAbsen-unsigned.ipa )
          ls -lh build/ios/iphoneos/FaceAbsen-unsigned.ipa
    artifacts:
      # Path artifact dievaluasi relatif terhadap working_directory (mobile/).
      # Dua varian dicantumkan agar tetap cocok bila Codemagic berubah dan
      # mengevaluasinya relatif terhadap root repo; yang tidak ada diabaikan.
      - build/ios/iphoneos/FaceAbsen-unsigned.ipa
      - build/ios/derived/Build/Products/Release-iphoneos/Runner.app
      - mobile/build/ios/iphoneos/FaceAbsen-unsigned.ipa
      - mobile/build/ios/derived/Build/Products/Release-iphoneos/Runner.app

  android-debug:
    name: Android debug APK (for sideloading)
    instance_type: linux_x2
    max_build_duration: 30
    working_directory: mobile
    environment:
      flutter: 3.22.2
      vars:
        # Ini workflow sideload/demo LAN (bukan untuk store): boleh http.
        API_BASE_URL: "http://192.168.120.111:3000/api/v1"
        ALLOW_INSECURE_HTTP: "true"
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: master
          include: true
      cancel_previous_builds: true
    cache:
      cache_paths:
        - $HOME/.pub-cache
    scripts:
      - name: Flutter pub get
        script: |
          flutter --version
          flutter pub get
      - name: Analyze & unit test
        script: |
          flutter analyze
          flutter test
      - name: Build Android debug APK
        script: |
          flutter build apk --debug \
            --dart-define=API_BASE_URL=$API_BASE_URL \
            --dart-define=ALLOW_INSECURE_HTTP=$ALLOW_INSECURE_HTTP
    artifacts:
      - build/app/outputs/flutter-apk/app-debug.apk
      - mobile/build/app/outputs/flutter-apk/app-debug.apk

  android-release:
    name: Android release AAB (signed)
    instance_type: linux_x2
    max_build_duration: 40
    working_directory: mobile
    environment:
      flutter: 3.22.2
      vars:
        # RILIS STORE (item #6 audit): wajib https + pin sertifikat.
        # JANGAN set ALLOW_INSECURE_HTTP=true di sini — build demo/sideload
        # LAN lewat workflow android-debug / ios-unsigned.
        # API_CERT_SHA256 diambil dari Environment variables Codemagic
        # (secure): fingerprint SHA-256 sertifikat TLS server produksi.
        API_BASE_URL: "http://192.168.120.111:3000/api/v1"
        ALLOW_INSECURE_HTTP: "false"
        # Isi variabel berikut di Codemagic (Environment variables, secure):
        # CM_KEYSTORE, CM_KEYSTORE_PASSWORD, CM_KEY_ALIAS, CM_KEY_PASSWORD
        # (base64 dari file keystore). Lihat docs/guides/ANDROID_COMPAT.md.
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: master
          include: true
      cancel_previous_builds: true
    cache:
      cache_paths:
        - $HOME/.pub-cache
    scripts:
      - name: Guard release policy (https + pin, no insecure flag)
        script: |
          # Item #6 audit: rilis store wajib https + API_CERT_SHA256, dan
          # tidak boleh membawa escape hatch ALLOW_INSECURE_HTTP=true.
          # Gagal cepat di CI jauh lebih baik daripada rilis yang throw
          # saat startup di perangkat (assertSecureConfiguration).
          set -e
          if [ "$ALLOW_INSECURE_HTTP" != "false" ]; then
            echo "ALLOW_INSECURE_HTTP harus 'false' untuk rilis store."
            echo "Build demo/sideload LAN: gunakan workflow android-debug."
            exit 1
          fi
          case "$API_BASE_URL" in
            https://*) ;;
            *)
              echo "Set API_BASE_URL (secure env Codemagic) ke https:// produksi."
              echo "Nilai sekarang: $API_BASE_URL"
              exit 1
              ;;
          esac
          if [ -z "$API_CERT_SHA256" ]; then
            echo "Set API_CERT_SHA256 (secure env Codemagic): fingerprint"
            echo "SHA-256 sertifikat TLS server produksi."
            exit 1
          fi
      - name: Flutter pub get
        script: |
          flutter --version
          flutter pub get
      - name: Decode keystore & write key.properties
        script: |
          echo "$CM_KEYSTORE" | base64 --decode > $CM_BUILD_DIR/keystore.jks
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=%s\n' \
            "$CM_KEYSTORE_PASSWORD" "$CM_KEY_PASSWORD" "$CM_KEY_ALIAS" "$CM_BUILD_DIR/keystore.jks" \
            > android/key.properties
      - name: Build Android release AAB
        script: |
          flutter build appbundle --release \
            --dart-define=API_BASE_URL=$API_BASE_URL \
            --dart-define=ALLOW_INSECURE_HTTP=$ALLOW_INSECURE_HTTP \
            --dart-define=API_CERT_SHA256=$API_CERT_SHA256
    artifacts:
      - build/app/outputs/bundle/release/app-release.aab
      - mobile/build/app/outputs/bundle/release/app-release.aab
