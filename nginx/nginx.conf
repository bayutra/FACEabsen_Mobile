# STEP 25 — TLS-terminating reverse proxy (PRD §70).
# Certs live in ./nginx/certs (staging: scripts/gen-cert.sh; prod: certbot).

upstream backend {
    server backend:3000;
}

upstream web {
    server web:3001;
}

# Plain HTTP: redirect everything to HTTPS (except ACME challenges).
server {
    listen 80;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name _;

    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;

    # Docker embedded DNS for per-request upstream re-resolution (see
    # the /api/v1/ location). Required for `docker compose --scale`.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Defense-in-depth headers (belt + suspenders behind helmet).
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    # HSTS: production serves HTTPS only (port 80 redirects above), so pin it.
    # NOTE: no CSP yet — Next.js needs nonce/hash work first; a naive CSP
    # would break inline runtime scripts. Tracked as follow-up hardening.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    client_max_body_size 1m;
    gzip on;
    gzip_types text/css application/javascript application/json;

    # Web dashboard + BFF (browser). Must come AFTER /api/v1/ so the
    # mobile direct-to-backend prefix wins (longest-prefix match).
    location / {
        proxy_pass http://web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Backend API for mobile apps (direct, prefix api/v1).
    # Browser traffic must NEVER hit this block — it goes through
    # the Next.js BFF above (/api/* without /v1/).
    #
    # Rush-hour scaling (`docker compose up -d --scale backend=3`): a static
    # proxy_pass hostname resolves ONCE at nginx startup and would pin all
    # traffic to a single replica, so this location resolves per request via
    # Docker's embedded DNS (which round-robins all healthy replicas).
    location /api/v1/ {
        set $backend_upstream http://backend:3000;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # BFF upstream (browser → Next.js → backend server-side).
    location /api/ {
        proxy_pass http://web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
