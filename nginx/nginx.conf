# TLS-terminating reverse proxy untuk API mobile + dashboard web.
# Certs: ./nginx/certs (staging: scripts/gen-cert.sh; produksi: certbot).

upstream backend {
    server backend:3000;
}

upstream web {
    server web:3001;
}

# Plain HTTP: redirect ke HTTPS (kecuali ACME challenge).
server {
    listen 80;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name _;

    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;

    # Docker embedded DNS untuk re-resolve upstream per request
    # (mendukung `docker compose --scale backend=3`).
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Defense-in-depth headers (di belakang helmet).
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    client_max_body_size 1m;
    gzip on;
    gzip_types application/json text/css application/javascript image/svg+xml;

    # API untuk aplikasi mobile dan dashboard. Mobile memakai /api/v1/ dan
    # tidak membutuhkan CORS karena bukan browser.
    location /api/v1/ {
        set $backend_upstream http://backend:3000;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Dashboard web (Next.js): /login, halaman monitoring, dan aset statis.
    # Dashboard memanggil API lewat rewrite internal Next ke backend.
    location / {
        proxy_pass http://web:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /_next/static/ {
        proxy_pass http://web:3001;
        proxy_set_header Host $host;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
